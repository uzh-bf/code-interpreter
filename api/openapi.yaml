openapi: 3.0.3
info:
  title: CodeAPI Internal Sandbox Runner API
  version: 2.0.0
  description: >-
    Internal service-to-sandbox contract. This API is not a public client
    surface. The public authenticated contract is service/openapi.yml.
x-internal: true

paths:
  /api/v2/execute:
    post:
      summary: Execute a prepared sandbox job
      operationId: executeSandboxJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: Sandbox execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '400':
          description: Invalid execution request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Runtime session workspace conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds the configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Sandbox execution failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        error:
          type: string

    ExecuteRequest:
      type: object
      required: [language, version, files]
      properties:
        session_id:
          type: string
          description: Top-level execution session identifier.
        output_session_id:
          type: string
          description: Storage session for generated files.
        language:
          type: string
        version:
          type: string
        args:
          type: array
          items:
            type: string
        stdin:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/InputFile'
        compile_memory_limit:
          type: integer
        run_memory_limit:
          type: integer
        run_timeout:
          type: integer
        compile_timeout:
          type: integer
        run_cpu_time:
          type: integer
        compile_cpu_time:
          type: integer
        env_vars:
          type: object
          additionalProperties:
            type: string
        egress_grant:
          type: string
          description: Opaque internal egress capability.
        execution_manifest:
          type: string
          description: Signed internal execution scope.
        tool_call_socket:
          type: boolean

    InputFile:
      type: object
      oneOf:
        - required: [content]
        - required: [id, storage_session_id]
      properties:
        id:
          type: string
          description: Storage object identifier for a by-reference input.
        storage_session_id:
          type: string
          description: Storage session for a by-reference input.
        input_cache_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stable SHA-256 runner-local cache identity.
        name:
          type: string
          description: Optional destination path; the runner supplies a default when omitted.
        content:
          type: string
          description: Inline file content.
        encoding:
          type: string
          enum: [base64, hex, utf8]
        entity_id:
          type: string
          description: Caller authorization scope echoed on inherited outputs.

    FileRef:
      type: object
      required: [id, name, storage_session_id]
      properties:
        id:
          type: string
        name:
          type: string
        storage_session_id:
          type: string
        modified_from:
          type: object
          required: [id, storage_session_id]
          properties:
            id:
              type: string
            storage_session_id:
              type: string
        inherited:
          type: boolean
          enum: [true]
        entity_id:
          type: string

    ExecutionStage:
      type: object
      required: [stdout, stderr, output]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        code:
          type: integer
          nullable: true
        signal:
          type: string
          nullable: true
        output:
          type: string
        memory:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        cpu_time:
          type: number
          nullable: true
        wall_time:
          type: number
          nullable: true

    ExecuteResponse:
      type: object
      required: [language, version, session_id, files]
      properties:
        compile:
          $ref: '#/components/schemas/ExecutionStage'
        run:
          $ref: '#/components/schemas/ExecutionStage'
        language:
          type: string
        version:
          type: string
        session_id:
          type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileRef'
